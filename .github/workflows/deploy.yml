name: Deploy

# Publishes the whole site to GitHub Pages:
#   /            latest main
#   /v/<tag>/    every release tag, frozen, built from its own code
# Runs when main changes or a release tag is pushed, then smoke-checks every
# version on the live URL.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Unique per run: stamped into releases.json and used as the Pages build
  # version, so redeploying an already-deployed commit still goes live.
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # the root is always latest main, even on a tag push
          fetch-depth: 0     # all history and tags, to build every release
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the release tag matches package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(git show "refs/tags/$TAG:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG points at a commit whose package.json says $version. Bump package.json in a PR first, then tag that commit."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - name: Smoke-check the built site
        run: |
          node scripts/serve.js 8080 _site &
          sleep 1
          node scripts/check-site.js http://localhost:8080/ --expect-sha "${{ steps.head.outputs.sha }}" --expect-build "$BUILD_ID" --all-releases
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          # deploy-pages names the deployment after GITHUB_SHA, and Pages skips a
          # build version it has already deployed (e.g. a tag on the commit main
          # just deployed). A unique version makes every run actually publish.
          GITHUB_SHA: ${{ needs.build.outputs.sha }}-${{ env.BUILD_ID }}

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Smoke-check every version on the live site
        run: >
          node scripts/check-site.js "${{ needs.deploy.outputs.page_url }}"
          --expect-sha "${{ needs.build.outputs.sha }}" --expect-build "$BUILD_ID"
          --all-releases --retries 18
