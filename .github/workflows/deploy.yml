name: Deploy

# Publishes the whole site to GitHub Pages:
#   /            latest main
#   /v/<tag>/    every release tag, frozen, built from its own code
#
# Releases are automatic: when a push to main carries a package.json version
# that has no tag yet, this run builds it as /v/v<version>/ too, deploys, checks
# the live site, and only then creates the tag and GitHub release.
#
# Tag pushes don't deploy. Pages skips a commit it has already deployed, so a
# tag made by hand on main's current commit could never publish on its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      build_id: ${{ steps.head.outputs.build_id }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # the root is always latest main
          fetch-depth: 0     # all history and tags, to build every release
      - id: head
        # build_id is unique per run and stamped into releases.json, so the live
        # check can tell this deploy from an older one of the same commit.
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_id=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Is this a new release?
        id: plan
        run: |
          release="$(node scripts/release-plan.js)"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ -n "$release" ]; then
            echo "New release: $release"
            # Local only, so build-all includes it. Pushed after the deploy checks out.
            git tag "$release" HEAD
          else
            echo "No new release (v$(node -p 'require("./package.json").version') is already tagged)"
          fi
      - run: npm test
      - run: npm run build
        env:
          BUILD_ID: ${{ steps.head.outputs.build_id }}
      - name: Smoke-check the built site
        run: |
          node scripts/serve.js 8080 _site &
          sleep 1
          node scripts/check-site.js http://localhost:8080/ --expect-sha "${{ steps.head.outputs.sha }}" \
            --expect-build "${{ steps.head.outputs.build_id }}" --all-releases
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # If Pages skipped the deploy (it already had this commit, e.g. a manual
      # re-run with nothing new), the build ID won't match and this fails.
      - name: Smoke-check every version on the live site
        run: >
          node scripts/check-site.js "${{ needs.deploy.outputs.page_url }}"
          --expect-sha "${{ needs.build.outputs.sha }}" --expect-build "${{ needs.build.outputs.build_id }}"
          --all-releases --retries 18

  release:
    needs: [build, verify]
    if: needs.build.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag and publish ${{ needs.build.outputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release }}
        run: >
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          --target "${{ needs.build.outputs.sha }}" --title "$TAG" --generate-notes
