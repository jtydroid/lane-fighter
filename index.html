<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Lane Fighter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23a9b59b'/%3E%3Cpath d='M2 3l5 3 7 2-7 2-5 3 2-5z' fill='%231c2318'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device">
    <header class="brand">
      <span class="logo">LANE<b>FIGHTER</b></span>
      <span class="model"><span id="variant"></span> · <span id="version"></span></span>
    </header>

    <div class="bezel">
      <canvas id="screen" aria-label="Game screen"></canvas>
    </div>

    <div class="controls">
      <div class="dpad">
        <button data-action="up" aria-label="Up">▲</button>
        <button data-action="down" aria-label="Down">▼</button>
      </div>
      <div class="small-buttons">
        <button class="pill" data-action="start">START</button>
        <button class="pill" data-action="mute">SOUND</button>
      </div>
      <div class="fire-wrap">
        <button class="fire" data-action="fire" aria-label="Fire"></button>
        <span class="fire-label">FIRE</span>
      </div>
    </div>
  </main>

  <section class="rules-panel" id="rules-panel" aria-labelledby="rules-title">
    <div class="rules-top">
      <h2 id="rules-title">Rules</h2>
      <label>Preset <select id="variant-select"></select></label>
      <label>Version <select id="release-select"><option>Latest</option></select></label>
    </div>
    <p class="variant-desc" id="variant-desc"></p>
    <div class="tabs" role="tablist" aria-label="Rule groups" id="rule-tabs"></div>
    <div id="rule-tabpanels"></div>
    <p class="rules-errors" id="rules-errors" role="alert" hidden></p>
    <div class="rules-actions">
      <span class="rules-status" id="rules-status" aria-live="polite"></span>
      <button type="button" id="rules-revert" class="ghost-btn">Undo edits</button>
      <button type="button" id="rules-reset" class="ghost-btn">Reset to preset</button>
      <button type="button" id="rules-share" class="ghost-btn">Copy link</button>
      <button type="button" id="rules-apply" class="apply-btn">Apply &amp; restart</button>
    </div>
  </section>

  <p class="help">↑ ↓ / W S move · Space / Z fire · Enter pause · M sound</p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
